name: New skill
description: Propose a skill before writing it.
title: "[new skill] <name>: "
labels: [new-skill]
body:
  - type: markdown
    attributes:
      value: |
        A new skill must do one job no existing skill does, and must run something that produces its check. Advice-only skills are not accepted. Read `standard/RULES.md` first.
  - type: input
    id: name
    attributes:
      label: Proposed name and pack
      placeholder: lockfile-diff (mstack-dev)
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: The one job, and what the user gets
    validations:
      required: true
  - type: textarea
    id: runs
    attributes:
      label: What the script runs or checks
      description: The check that decides pass or fail. If you cannot describe it, the skill is not ready.
    validations:
      required: true
  - type: textarea
    id: requests
    attributes:
      label: Three requests where it should start, in a user's own words
    validations:
      required: true
  - type: textarea
    id: neighbours
    attributes:
      label: Nearest existing skills, and why this is not their job
      description: "`python3 packs/core/skills/mstack/scripts/find.py search <words>` helps find them."
    validations:
      required: true
  - type: input
    id: needs
    attributes:
      label: Tools it needs
      placeholder: none, or ffmpeg, a browser, git
