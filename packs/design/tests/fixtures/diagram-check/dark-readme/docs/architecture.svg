<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img">
  <title>Order service architecture</title>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
  <g id="web"><rect x="20" y="80" width="140" height="60" rx="6" fill="#ffffff" stroke="#374151"/><text x="90" y="115" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#111827">Web app</text></g>
  <g id="orders"><rect x="250" y="80" width="140" height="60" rx="6" fill="#ffffff" stroke="#374151"/><text x="320" y="115" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#111827">Order service</text></g>
  <g id="ledger"><rect x="480" y="80" width="110" height="60" rx="6" fill="#ffffff" stroke="#374151"/><text x="535" y="115" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#111827">Payments ledger store</text></g>
  <line id="web-orders" x1="160" y1="110" x2="246" y2="110" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line id="orders-ledger" x1="390" y1="110" x2="476" y2="110" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text id="caption" x="20" y="200" font-family="sans-serif" font-size="13" fill="#374151">Requests flow left to right; the ledger is append-only.</text>
</svg>
